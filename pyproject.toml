[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curobo-rocm-wrapper"
version = "0.1.0"
description = "Versioned ROCm adaptation wrapper for cuRobo v0.7.8 and v0.8.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.8"]

[project.scripts]
curobo-rocm-wrapper = "curobo_rocm_wrapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["D", "E", "F", "I"]
